name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, package, and draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install presentation dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Validate source and behavior
        run: |
          npm run validate
          npm test
          npm run test:release
      - name: Verify tag matches manifest version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p 'require("./module.json").version')"
          test "$RELEASE_TAG" = "v$VERSION"
      - name: Build release assets from tagged commit
        run: python -B dev-tools/buildScripts/build_release.py --dist dist --ref "$GITHUB_SHA" --release-tag "${{ github.ref_name }}" --allow-dirty
      - name: Render release banner
        run: python -B dev-tools/buildScripts/generate_foundry_banner.py --manifest module.json --output-dir dist
      - name: Refresh Foundry package description
        run: python -B dev-tools/buildScripts/generate_foundry_description.py
      - name: Prepare release notes from CHANGELOG.md
        run: python -B dev-tools/buildScripts/generate_release_notes.py --manifest module.json --output dist/release-notes.md
      - name: Verify release checksums
        run: (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/module.json
            dist/SHA256SUMS.txt
            dist/*-banner.webp
            dist/banner-death-token-effects.webp
